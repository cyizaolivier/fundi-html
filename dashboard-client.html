<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard - FundiLink</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.png">
</head>
<body>
<header>
  <div class="brand-row">
    <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="mk-ink-stroke" d="M17 56 V24 Q17 12 29 12 H34" fill="none" stroke-width="9"/><rect class="mk-ink" x="40" y="8" width="9" height="48"/><rect class="mk-green" x="6" y="29" width="43" height="8"/></svg><span class="logo-word">FundiLink</span></a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html" data-page="index.html">Home</a></li>
        <li><a href="about.html" data-page="about.html">About</a></li>
        <li><a href="contact.html" data-page="contact.html">Contact</a></li>
        <li id="account-nav-slot"><a href="login.html" data-page="login.html">Login</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="dash-head">
    <h1 id="welcome-heading">Welcome back</h1>
    <p>Book a fundi or check the status of your requests below.</p>
  </section>

  <!-- Form 2: validation is done entirely with HTML5 attributes
       (required on the select/date/textarea, plus a min date set
       from today so past dates are rejected by the browser itself). -->
  <form class="card" id="booking-form">
    <h2>Request a booking</h2>

    <div class="form-field">
      <label for="b-fundi">Choose a fundi</label>
      <select id="b-fundi" required>
        <option value="">Loading fundis...</option>
      </select>
    </div>

    <div class="form-field">
      <label for="b-date">Preferred date</label>
      <input type="date" id="b-date" required>
    </div>

    <div class="form-field">
      <label for="b-description">Describe the job</label>
      <textarea id="b-description" rows="4" minlength="10" required></textarea>
    </div>

    <button type="submit">Send booking request</button>
    <div class="status-msg hidden" id="booking-status"></div>
  </form>

  <h2 class="section-title">My bookings</h2>
  <div id="my-bookings"><p class="muted">Loading your bookings...</p></div>
</main>

<footer>
  <div class="footer-row">
    <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="mk-ink-stroke" d="M17 56 V24 Q17 12 29 12 H34" fill="none" stroke-width="9"/><rect class="mk-ink" x="40" y="8" width="9" height="48"/><rect class="mk-green" x="6" y="29" width="43" height="8"/></svg><span class="logo-word">FundiLink</span></a>
    <p><a href="server-time.php">Server time</a> &nbsp;&middot;&nbsp; &copy; 2026 FundiLink. Kigali, Rwanda.</p>
  </div>
</footer>

<script src="js/seed-data.js"></script>
<script src="js/store.js"></script>
<script src="js/main.js"></script>
<script>
  const session = requireRole('client');
  let fundis = [];

  async function init() {
    if (!session) return;
    document.getElementById('welcome-heading').textContent = `Welcome back, ${session.name}`;
    fundis = await getFundis();
    document.getElementById('b-fundi').innerHTML = '<option value="">Select a fundi</option>' +
      fundis.map((f) => `<option value="${esc(f.username)}">${esc(f.name)} - ${esc(f.trade)}${f.location ? ' (' + esc(f.location) + ')' : ''}</option>`).join('');
    // HTML5 min attribute: the date picker itself refuses past dates.
    document.getElementById('b-date').min = new Date().toISOString().split('T')[0];
    await renderMyBookings();
  }

  async function renderMyBookings() {
    const mine = (await loadAllBookings()).filter((b) => b.clientUsername === session.username).reverse();
    const box = document.getElementById('my-bookings');
    if (mine.length === 0) { box.innerHTML = '<p class="muted" style="padding:1.2rem 0;">No booking requests yet. Send your first one above.</p>'; return; }
    box.innerHTML = mine.map((b) => {
      const f = fundis.find((x) => x.username === b.fundiUsername);
      return `<div class="booking-item">
        <div><strong>${esc(b.category)}</strong> with ${esc(f ? f.name : b.fundiUsername)} on ${esc(b.date)}
        <p class="muted" style="margin-top:2px;">${esc(b.description)}</p></div>
        ${renderStatusPill(b.status)}</div>`;
    }).join('');
  }

  document.getElementById('booking-form').addEventListener('submit', async (e) => {
    e.preventDefault(); // HTML5 validation has already passed
    const sel = document.getElementById('b-fundi');
    const status = document.getElementById('booking-status');
    const f = fundis.find((x) => x.username === sel.value);
    const r = await addBooking({
      clientUsername: session.username, fundiUsername: sel.value, category: f ? f.trade : 'General',
      date: document.getElementById('b-date').value, description: document.getElementById('b-description').value.trim(),
    });
    status.textContent = r.ok ? 'Booking request sent. The fundi will accept or decline it soon.' : (r.message || 'Could not send the request.');
    status.className = 'status-msg ' + (r.ok ? 'success' : 'error');
    if (r.ok) { e.target.reset(); await renderMyBookings(); }
  });

  init();
</script>
</body>
</html>
