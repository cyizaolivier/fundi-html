<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundi Dashboard - FundiLink</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.png">
</head>
<body>
<header>
  <div class="brand-row">
    <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="mk-ink-stroke" d="M17 56 V24 Q17 12 29 12 H34" fill="none" stroke-width="9"/><rect class="mk-ink" x="40" y="8" width="9" height="48"/><rect class="mk-green" x="6" y="29" width="43" height="8"/></svg><span class="logo-word">FundiLink</span></a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html" data-page="index.html">Home</a></li>
        <li><a href="about.html" data-page="about.html">About</a></li>
        <li><a href="contact.html" data-page="contact.html">Contact</a></li>
        <li id="account-nav-slot"><a href="login.html" data-page="login.html">Login</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="dash-head">
    <h1 id="welcome-heading">Welcome back</h1>
    <p>Review incoming booking requests and keep your profile up to date.</p>
  </section>

  <h2 class="section-title">Incoming booking requests</h2>
  <div id="incoming-bookings"><p class="muted">Loading requests...</p></div>

  <!-- Form 3: validation is done entirely with HTML5 attributes
       (min/step on the number input, required on the select and
       textarea, minlength on the bio). -->
  <form class="card" id="profile-form" style="margin-top:1.8rem;">
    <h2>Update my profile</h2>

    <div class="form-field">
      <label for="p-rate">Rate (RWF)</label>
      <input type="number" id="p-rate" min="500" step="100" required>
    </div>

    <div class="form-field">
      <label for="p-availability">Availability</label>
      <select id="p-availability" required>
        <option value="">Select availability</option>
        <option value="Available today">Available today</option>
        <option value="Available this week">Available this week</option>
        <option value="Fully booked">Fully booked</option>
      </select>
    </div>

    <div class="form-field">
      <label for="p-bio">Short bio</label>
      <textarea id="p-bio" rows="4" minlength="10" required></textarea>
    </div>

    <button type="submit">Save profile</button>
    <div class="status-msg hidden" id="profile-status"></div>
  </form>
</main>

<footer>
  <div class="footer-row">
    <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="mk-ink-stroke" d="M17 56 V24 Q17 12 29 12 H34" fill="none" stroke-width="9"/><rect class="mk-ink" x="40" y="8" width="9" height="48"/><rect class="mk-green" x="6" y="29" width="43" height="8"/></svg><span class="logo-word">FundiLink</span></a>
    <p><a href="server-time.php">Server time</a> &nbsp;&middot;&nbsp; &copy; 2026 FundiLink. Kigali, Rwanda.</p>
  </div>
</footer>

<script src="js/seed-data.js"></script>
<script src="js/store.js"></script>
<script src="js/main.js"></script>
<script>
  const session = requireRole('fundi');

  async function init() {
    if (!session) return;
    document.getElementById('welcome-heading').textContent = `Welcome back, ${session.name}`;
    const me = (await getFundis()).find((f) => f.username === session.username);
    if (me) {
      if (me.rate) document.getElementById('p-rate').value = me.rate;
      if (me.availability) document.getElementById('p-availability').value = me.availability;
      if (me.bio) document.getElementById('p-bio').value = me.bio;
    }
    await renderIncoming();
  }

  async function renderIncoming() {
    const mine = (await loadAllBookings()).filter((b) => b.fundiUsername === session.username).reverse();
    const box = document.getElementById('incoming-bookings');
    if (mine.length === 0) { box.innerHTML = '<p class="muted" style="padding:1.2rem 0;">No booking requests yet. Complete your profile so clients can find you.</p>'; return; }
    box.innerHTML = mine.map((b) => `
      <div class="booking-item">
        <div><strong>${esc(b.category)}</strong> requested for ${esc(b.date)}
        <p class="muted" style="margin-top:2px;">${esc(b.description)}</p></div>
        <div style="display:flex; align-items:center; gap:0.6rem;">
          ${renderStatusPill(b.status)}
          ${b.status === 'pending' ? `<span class="booking-actions">
            <button type="button" class="accept-btn" data-id="${esc(b.id)}">Accept</button>
            <button type="button" class="decline-btn" data-id="${esc(b.id)}">Decline</button></span>` : ''}
        </div>
      </div>`).join('');
    box.querySelectorAll('.accept-btn').forEach((btn) => btn.addEventListener('click', async () => { await setBookingStatus(btn.dataset.id, 'accepted'); renderIncoming(); }));
    box.querySelectorAll('.decline-btn').forEach((btn) => btn.addEventListener('click', async () => { await setBookingStatus(btn.dataset.id, 'declined'); renderIncoming(); }));
  }

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault(); // HTML5 validation has already passed
    const status = document.getElementById('profile-status');
    const r = await saveProfile(session.username, {
      rate: Number(document.getElementById('p-rate').value),
      availability: document.getElementById('p-availability').value,
      bio: document.getElementById('p-bio').value.trim(),
    });
    status.textContent = r.ok ? 'Profile saved. Clients now see your updated rate and availability.' : (r.message || 'Could not save.');
    status.className = 'status-msg ' + (r.ok ? 'success' : 'error');
  });

  init();
</script>
</body>
</html>
