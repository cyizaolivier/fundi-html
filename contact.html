</head>
<body>
<header>
  <div class="brand-row">
    <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="mk-ink-stroke" d="M17 56 V24 Q17 12 29 12 H34" fill="none" stroke-width="9"/><rect class="mk-ink" x="40" y="8" width="9" height="48"/><rect class="mk-green" x="6" y="29" width="43" height="8"/></svg><span class="logo-word">FundiLink</span></a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html" data-page="index.html">Home</a></li>
        <li><a href="about.html" data-page="about.html">About</a></li>
        <li><a href="contact.html" data-page="contact.html">Contact</a></li>
        <li><a href="register.html" data-page="register.html">Become a fundi</a></li>
        <li id="account-nav-slot"><a href="login.html" data-page="login.html">Login</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="card" style="margin-bottom:1.5rem;">
    <h2>Contact information</h2>
    <address>KG 7 Ave, Kacyiru, Kigali, Rwanda</address>
    <p>Telephone: <a href="tel:+250788123456">+250 788 123 456</a></p>
    <p>Email: <a href="mailto:hello@fundilink.rw">hello@fundilink.rw</a></p>
  </section>

  <!-- Form 1: validation is done entirely with HTML5 attributes
       (required, minlength, type="email") - the browser blocks
       submission and shows its own messages until every rule passes. -->
  <form class="card" id="contact-form">
    <h2>Send us a message</h2>

    <div class="form-field">
      <label for="c-name">Full name</label>
      <input type="text" id="c-name" name="name" minlength="2" required>
    </div>

    <div class="form-field">
      <label for="c-email">Email address</label>
      <input type="email" id="c-email" name="email" required>
    </div>

    <div class="form-field">
      <label for="c-message">Message</label>
      <textarea id="c-message" name="message" rows="5" minlength="10" required></textarea>
    </div>

    <button type="submit">Send message</button>
    <div class="status-msg hidden" id="contact-status"></div>
  </form>
</main>

<footer>
  <div class="footer-row">
    <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="mk-ink-stroke" d="M17 56 V24 Q17 12 29 12 H34" fill="none" stroke-width="9"/><rect class="mk-ink" x="40" y="8" width="9" height="48"/><rect class="mk-green" x="6" y="29" width="43" height="8"/></svg><span class="logo-word">FundiLink</span></a>
    <p><a href="server-time.php">Server time</a> &nbsp;&middot;&nbsp; &copy; 2026 FundiLink. Kigali, Rwanda.</p>
  </div>
</footer>

<script src="js/seed-data.js"></script>
<script src="js/store.js"></script>
<script src="js/main.js"></script>
<script>
  // The form only reaches this listener once HTML5 validation has
  // already passed, so no manual field checks are needed here.
  document.getElementById('contact-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('c-name').value.trim();
    const status = document.getElementById('contact-status');
    status.textContent = `Thanks ${name}, your message has been received. We will reply by email shortly.`;
    status.className = 'status-msg success';
    e.target.reset();
  });
</script>
</body>
</html>
