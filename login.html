<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - FundiLink</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.png">
</head>
<body>
<header>
  <div class="brand-row">
    <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="mk-ink-stroke" d="M17 56 V24 Q17 12 29 12 H34" fill="none" stroke-width="9"/><rect class="mk-ink" x="40" y="8" width="9" height="48"/><rect class="mk-green" x="6" y="29" width="43" height="8"/></svg><span class="logo-word">FundiLink</span></a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html" data-page="index.html">Home</a></li>
        <li><a href="about.html" data-page="about.html">About</a></li>
        <li><a href="contact.html" data-page="contact.html">Contact</a></li>
        <li><a href="register.html" data-page="register.html">Become a fundi</a></li>
        <li id="account-nav-slot"><a href="login.html" data-page="login.html">Login</a></li>
      </ul>
    </nav>
  </div>
</header>

<main style="max-width:420px;">
  <!-- Required fields use plain HTML5 validation; matching the
       username/password against the account list is authentication
       logic (not a format check), so that part stays in JavaScript. -->
  <form class="card" id="login-form">
    <h2>Login</h2>
    <p class="muted" style="margin-bottom:0.6rem;">Choose your account type</p>
    <div class="role-toggle">
      <button type="button" class="role-btn active" data-role="client">I'm a client</button>
      <button type="button" class="role-btn" data-role="fundi">I'm a fundi</button>
    </div>
    <input type="hidden" id="login-role" value="client">

    <div class="form-field">
      <label for="login-username">Username</label>
      <input type="text" id="login-username" minlength="3" required>
    </div>

    <div class="form-field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" minlength="6" required>
    </div>

    <button type="submit">Login</button>
    <div class="status-msg hidden" id="login-status"></div>
    <p class="muted" style="margin-top:1rem;">Demo accounts: client1 / client123, or jpelectric / fundi123.</p>
    <p class="muted">No account? <a href="register.html">Register here</a>.</p>
  </form>
</main>

<footer>
  <div class="footer-row">
    <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="mk-ink-stroke" d="M17 56 V24 Q17 12 29 12 H34" fill="none" stroke-width="9"/><rect class="mk-ink" x="40" y="8" width="9" height="48"/><rect class="mk-green" x="6" y="29" width="43" height="8"/></svg><span class="logo-word">FundiLink</span></a>
    <p><a href="server-time.php">Server time</a> &nbsp;&middot;&nbsp; &copy; 2026 FundiLink. Kigali, Rwanda.</p>
  </div>
</footer>

<script src="js/seed-data.js"></script>
<script src="js/store.js"></script>
<script src="js/main.js"></script>
<script>
  document.querySelectorAll('.role-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.role-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('login-role').value = btn.dataset.role;
    });
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('login-status');
    const role = document.getElementById('login-role').value;
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    const result = await handleLogin(document.getElementById('login-username').value.trim(), document.getElementById('login-password').value, role);
    btn.disabled = false;
    if (!result.ok) {
      status.textContent = result.message;
      status.className = 'status-msg error';
      return;
    }
    status.textContent = `Welcome back, ${result.user.name}. Opening your dashboard...`;
    status.className = 'status-msg success';
    window.location.href = role === 'client' ? 'dashboard-client.html' : 'dashboard-fundi.html';
  });
</script>
</body>
</html>
